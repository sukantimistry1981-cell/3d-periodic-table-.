
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon 3D Periodic Table</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#050816;color:white;
  font-family:Arial,sans-serif;text-align:center;
}
h1{
  color:#00f5ff;font-size:30px;
  text-shadow:0 0 10px #00f5ff,0 0 25px #008cff;
  margin:25px 10px 8px;
}
p{color:#a7c8e8}
input{
  width:85%;max-width:400px;padding:13px;
  border:1px solid #00f5ff;border-radius:10px;
  background:#10152b;color:white;font-size:16px;
  margin:12px;
}
.table{
  display:grid;
  grid-template-columns:repeat(18,minmax(48px,1fr));
  gap:5px;min-width:1000px;
  padding:15px;
}
.wrapper{overflow-x:auto}
.element{
  height:72px;padding:5px 2px;
  border:1px solid var(--c);border-radius:8px;
  background:#0c1428;color:var(--c);
  box-shadow:0 0 7px var(--c);
  cursor:pointer;transition:.2s;
}
.element:hover{
  transform:translateY(-5px) scale(1.06);
  box-shadow:0 0 15px var(--c),0 0 30px var(--c);
  background:#152443;
}
.num{font-size:10px;display:block;text-align:left}
.sym{font-size:22px;font-weight:bold;display:block}
.name{font-size:9px;display:block}
.alkali{--c:#ff6688}
.alkaline{--c:#ffb347}
.transition{--c:#ffe66d}
.post{--c:#42ffb0}
.metalloid{--c:#00f5ff}
.nonmetal{--c:#66aaff}
.halogen{--c:#c084fc}
.noble{--c:#ff66dd}
.lanthanide{--c:#50e6ff}
.actinide{--c:#ff8b9e}
.unknown{--c:#aaa}
#info{
  display:none;margin:20px auto;padding:20px;
  max-width:500px;width:90%;border:1px solid #00f5ff;
  border-radius:14px;background:#10152b;
  box-shadow:0 0 20px #00f5ff55;
}
#info h2{color:#00f5ff}
button{
  background:#00f5ff;color:#050816;border:0;
  border-radius:8px;padding:10px 18px;font-weight:bold;
}
footer{padding:25px;color:#8296b8;font-size:12px}
</style>
</head>
<body>

<h1>⚛ NEON ATLAS</h1>
<p>3D FUTURISTIC PERIODIC TABLE</p>
<input id="search" placeholder="Search element or symbol...">
<div class="wrapper"><div class="table" id="table"></div></div>

<div id="info">
  <h2 id="title"></h2>
  <p id="description"></p>
  <p id="properties"></p>
  <button onclick="document.getElementById('info').style.display='none'">CLOSE</button>
</div>

<footer>118 ELEMENTS · EXPLORE THE UNIVERSE OF CHEMISTRY</footer>

const table=document.getElementById("table");
const search=document.getElementById("search");
const info=document.getElementById("info");

data.forEach(e=>{
  const [symbol,name,num,col,row,cat,mass]=e;
  const cell=document.createElement("button");
  cell.className="element "+cat;
  cell.style.gridColumn=col;
  cell.style.gridRow=row;
  cell.dataset.search=(symbol+" "+name+" "+num).toLowerCase();
  cell.innerHTML=`<span class="num">${num}</span>
    <span class="sym">${symbol}</span>
    <span class="name">${name}</span>`;
  cell.onclick=()=>{
    document.getElementById("title").textContent=name+" ("+symbol+")";
    document.getElementById("description").textContent=
      name+" is a chemical element with atomic number "+num+".";
    document.getElementById("properties").textContent=
      "Category: "+cat.charAt(0).toUpperCase()+cat.slice(1);
    info.style.display="block";
    document.getElementById("details").innerHTML="";
    const details=[
      ["Atomic Number",num],
      ["Atomic Mass",mass],
      ["Symbol",symbol],
      ["Category",cat],
      ["Period",row<=7?row:"—"],
      ["Group",row<=7?col:"—"]
    ];
    details.forEach(d=>{
      const div=document.createElement("div");
      div.className="detail";
      const b=document.createElement("b");
      b.textContent=d[0];
      div.append(b,document.createTextNode(d[1]));
      document.getElementById("details").appendChild(div);
    });
    info.scrollIntoView({behavior:"smooth",block:"center"});
  };
  table.appendChild(cell);
});

search.addEventListener("input",()=>{
  const q=search.value.toLowerCase().trim();
  document.querySelectorAll(".element").forEach(el=>{
    el.style.opacity=el.dataset.search.includes(q)?"1":"0.12";
  });
});
